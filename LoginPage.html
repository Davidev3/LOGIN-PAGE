<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login UI Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Login.css">
  <script src="js/grayscale-mode.js" defer></script>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <main class="login-form">
    <h1>Login</h1>
    <form id="login-form">
      <div class="input-wrapper">
        <label class="sr-only" for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Email" autocomplete="username" required>
      </div>
      <div class="input-wrapper">
        <label class="sr-only" for="senha">Password</label>
        <input id="senha" name="senha" type="password" placeholder="Password" autocomplete="current-password" required>
      </div>
      <div class="remember-forgot-container">
        <div class="checkbox-container">
          <input type="checkbox" id="lembrar">
          <label for="lembrar">Remember me</label>
        </div>
        <a href="#" class="forgot-password" data-demo-link>Forgot password?</a>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <p>Don't have an account? <a href="#" class="register" data-demo-link>Register</a></p>
    <div id="popup" class="popup" role="status" aria-live="polite">
      <span id="popup-msg"></span>
      <button id="popup-close" type="button" aria-label="Close message">×</button>
    </div>
  </main>
</body>
</html>
